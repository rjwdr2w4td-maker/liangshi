services:
  - type: web
    name: liangshi
    env: node
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npx tsx api/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /opt/render/project/data/grain.db
    disk:
      name: data
      mountPath: /opt/render/project/data
      sizeGB: 1
