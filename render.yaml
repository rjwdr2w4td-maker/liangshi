services:
  - type: web
    name: liangshi-api
    env: node
    buildCommand: npm install
    startCommand: npx tsx api/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./data/grain.db
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1