    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script type="text/javascript">
      // SPA fallback: redirect to index.html for client-side routing
      var pathSegmentsToKeep = 1;
      var l = window.location;
      if (l.pathname.split('/').length > pathSegmentsToKeep + 1) {
        // Not the root, check if we need to redirect
        if (!l.pathname.endsWith('/') && !l.pathname.match(/\.[a-zA-Z0-9]+$/)) {
          l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, pathSegmentsToKeep + 1).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/')
          );
        }
      }
    </script>
    <script type="module" crossorigin src="/liangshi/assets/index-BCvz2wCl.js"></script>
